@if (isLoading()) {
  <div
    class="spinner-overlay position-fixed top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center bg-dark bg-opacity-75"
  >
    <div class="spinner-border text-light" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    @if (message()) {
      <p class="mt-3 mb-0 text-white fw-medium">{{ message() }}</p>
    }
  </div>
}
