<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <header class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0">Dao.Maxxing sandbox</h1>
        <app-theme-toggle />
      </header>

      <main>
        <section class="card mb-4" aria-labelledby="auth-heading">
          <div class="card-body">
            <h2 id="auth-heading" class="h5">API client</h2>
            @if (auth.error()) {
              <div class="alert alert-danger" role="alert">{{ auth.error() }}</div>
            }
            @if (auth.user(); as user) {
              <div class="d-flex align-items-center gap-3">
                <p class="mb-0">Signed in as {{ user.name || user.id }}</p>
                <button
                  type="button"
                  class="btn btn-outline-secondary btn-sm"
                  (click)="auth.logout()"
                >
                  Sign out
                </button>
              </div>
              <app-weather />
            } @else {
              <p>Sign in to load the forecast through the generated client.</p>
              <button type="button" class="btn btn-primary" (click)="auth.login()">Sign in</button>
            }
          </div>
        </section>

        <section class="card mb-4" aria-labelledby="form-heading">
          <div class="card-body">
            <h2 id="form-heading" class="h5">Form fields</h2>
            <form [formGroup]="form" (ngSubmit)="save()" novalidate>
              <app-form-field label="Food name" [control]="form.controls.name">
                <input
                  appFieldControl
                  class="form-control"
                  formControlName="name"
                  autocomplete="off"
                />
              </app-form-field>
              <app-form-field
                label="Serving (g)"
                hint="Between 1 and 5000 grams."
                [control]="form.controls.servingGrams"
              >
                <input
                  appFieldControl
                  class="form-control"
                  type="number"
                  formControlName="servingGrams"
                />
              </app-form-field>
              <app-form-field label="Meal" [control]="form.controls.meal">
                <select appFieldControl class="form-select" formControlName="meal">
                  <option value="breakfast">Breakfast</option>
                  <option value="lunch">Lunch</option>
                  <option value="dinner">Dinner</option>
                  <option value="snack">Snack</option>
                </select>
              </app-form-field>
              <div class="form-check mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="favorite"
                  formControlName="favorite"
                />
                <label class="form-check-label" for="favorite">Add to favorites</label>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save food</button>
                <button type="button" class="btn btn-outline-secondary" (click)="form.reset()">
                  Reset
                </button>
              </div>
            </form>
          </div>
        </section>

        <section class="card mb-4" aria-labelledby="feedback-heading">
          <div class="card-body">
            <h2 id="feedback-heading" class="h5">Feedback</h2>
            <div class="alert alert-success" role="status">Logged 3 foods today.</div>
            <div class="alert alert-warning">Your daily goal isn't set yet.</div>
            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="btn btn-outline-danger" (click)="confirmDelete()">
                <i class="bi bi-trash" aria-hidden="true"></i> Delete food
              </button>
              <button type="button" class="btn btn-outline-secondary" (click)="showAlert()">
                Show alert
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="notifications.info('Food added to breakfast.')"
              >
                Show toast
              </button>
              <button type="button" class="btn btn-outline-secondary" (click)="showSpinner()">
                Show spinner
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
</div>
